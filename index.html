<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Evita que Chrome/Google Translate reescriba el DOM mientras React lo controla —
         esa pelea entre los dos es la causa real de "Failed to execute 'insertBefore'/
         'removeChild' on 'Node'" que le sale al equipo de vez en cuando. No es un bug del
         CRM: React actualiza un nodo de texto que el traductor ya movió/reemplazó por su
         cuenta, y ninguno de los dos sabe que el otro lo tocó. -->
    <meta name="google" content="notranslate" />
    <meta name="description" content="Bit CRM — herramienta interna de Bit Proximity para gestionar contactos, empresas y oportunidades de venta." />
    <link rel="icon" type="image/png" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/favicon-512.png" />
    <title>Bit CRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-brand-bg text-brand-white font-manrope" translate="no">
    <div id="root">
      <!-- Contenido estático de respaldo — lo reemplaza React al cargar, pero sirve para
           que cualquier verificador automático (ej. la revisión de marca de Google OAuth)
           que solo lee el HTML crudo, sin ejecutar JavaScript, encuentre el nombre y el
           propósito de la app en vez de un contenedor vacío. -->
      <div style="max-width:640px;margin:64px auto;padding:0 24px;font-family:-apple-system,sans-serif;">
        <h1>Bit CRM</h1>
        <p>Bit CRM es una herramienta interna de Bit Proximity para gestionar contactos, empresas y oportunidades de venta.</p>
        <p><a href="/privacy">Política de Privacidad</a> · <a href="/terms">Términos del Servicio</a></p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
